<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>
<title>พิมพ์สติกเกอร์ยา</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f6f9;
  font-family: Arial, sans-serif;
  color: #1f2937;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  margin: 0 0 20px;
  font-size: 24px;
}

.toolbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 15px;
}

button {
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#printBtn {
  background: #16a34a;
  color: #fff;
}

.searchbar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.searchbar input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.table-wrap {
  width: 100%;
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th,
td {
  border: 1px solid #e2e8f0;
  padding: 10px;
  font-size: 14px;
}

th {
  background: #f1f5f9;
}

.check-cell {
  width: 50px;
  text-align: center;
}

.empty,
.error {
  text-align: center;
  padding: 25px;
}

.error {
  color: #b91c1c;
}


/* =====================================================
 * PRINT AREA
 *
 * 1 sheet = 88 x 58 mm
 * 2 labels = 29 mm each
===================================================== */

#printArea {
  display: block;
  margin: 0;
  padding: 0;
}

.sheet {
  width: 88mm;
  height: 58mm;
  margin: 0;
  padding: 0;

  display: flex;
  flex-direction: column;

  overflow: hidden;
  background: #fff;

  break-after: page;
  page-break-after: always;
}

.label {
  width: 88mm;
  height: 29mm;

  flex: 0 0 29mm;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 1.5mm;

  overflow: hidden;

  border-bottom: .5px dashed #000;
}

.label:last-child {
  border-bottom: none;
}

.left {
  min-width: 0;
  flex: 1;
  padding-right: 1mm;
}

.code {
  font-size: 14px;
  font-weight: bold;
  line-height: 1.2;
}

.name {
  margin-top: 1mm;
  font-size: 10px;
  line-height: 1.2;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lot,
.exp {
  margin-top: .8mm;
  font-size: 10px;
  line-height: 1.15;
}

.right {
  width: 25mm;
  flex: 0 0 25mm;

  text-align: center;
}

.qr {
  display: block;

  width: 21mm;
  height: 21mm;

  margin: 0 auto;

  object-fit: contain;
}

.user {
  margin-top: .5mm;

  font-size: 6px;
  line-height: 1;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =====================================================
 * PRINT MODE
===================================================== */

@page {
  size: 88mm 58mm;
  margin: 0;
}

@media print {

  html,
  body {
    width: 88mm;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff;
  }

  body * {
    visibility: hidden;
  }

  #printArea,
  #printArea * {
    visibility: visible;
  }

  #printArea {
    position: absolute;
    left: 0;
    top: 0;
    width: 88mm;
  }

  .sheet {
    margin: 0;
  }

  .toolbar,
  .table-wrap,
  h1,
  .searchbar {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>พิมพ์สติกเกอร์ยา</h1>

    <div class="toolbar">
      <button id="printBtn" type="button">
        พิมพ์รายการที่เลือก
      </button>
    </div>

    <div class="searchbar">
      <input
        type="text"
        id="searchBox"
        autocomplete="off"
        placeholder="ค้นหา CODE / NAME / LOT / EXP..."
      >
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="check-cell">
              <input
                type="checkbox"
                id="masterCheck"
                title="เลือกทั้งหมด"
              >
            </th>
            <th>CODE</th>
            <th>NAME</th>
            <th>LOT</th>
            <th>EXP</th>
          </tr>
        </thead>

        <tbody id="drugTable"></tbody>
      </table>
    </div>

    <div id="printArea"></div>

  </div>
</div>

<script src="/modules/sticker-print/sticker.js"></script>

</body>
</html>
