<div class="ems-check-app">

  <div class="card stock-card">

    <!-- ======================================
         HEADER
    ======================================= -->
    <div class="card-header stock-header">

      <!-- HEADER LEFT -->
      <div class="stock-header-left">

        <div class="stock-icon">
          💉
        </div>

        <div>
          <h1>Vaccine Management</h1>

          <p>
            ระบบบริการและบริหารจัดการวัคซีน
          </p>
        </div>

      </div>


      <!-- ======================================
           HEADER RIGHT / USER
      ======================================= -->

      <div class="stock-header-right">

        <!-- USER MENU -->
        <div class="ems-user-menu">

          <button
            type="button"
            class="ems-user-trigger"
            id="emsUserTrigger"
          >

            <span class="ems-user-avatar">
              <i class="fa-solid fa-user"></i>
            </span>

            <span class="ems-user-info">

              <strong id="currentUserName">
                สมชาย
              </strong>

              <small>
                ผู้ใช้งาน
              </small>

            </span>

            <i class="fa-solid fa-chevron-down ems-user-arrow"></i>

          </button>


          <!-- USER DROPDOWN -->

          <div
            class="ems-user-dropdown"
            id="emsUserDropdown"
          >

            <div class="ems-user-dropdown-header">

              <span class="ems-user-avatar large">

                <i class="fa-solid fa-user"></i>

              </span>

              <div>

                <strong id="dropdownUserName">
                  สมชาย
                </strong>

                <small>
                  ผู้ใช้งาน
                </small>

              </div>

            </div>


            <div class="ems-user-divider"></div>


            <!-- PROFILE -->

            <button
              type="button"
              id="profileBtn"
            >

              <i class="fa-solid fa-user"></i>

              โปรไฟล์

            </button>


            <!-- PASSWORD -->

            <button
              type="button"
              id="changePasswordBtn"
            >

              <i class="fa-solid fa-key"></i>

              เปลี่ยนรหัสผ่าน

            </button>


            <div class="ems-user-divider"></div>


            <!-- LOGOUT -->

            <button
              type="button"
              class="ems-user-logout"
              id="logoutBtn"
            >

              <i class="fa-solid fa-right-from-bracket"></i>

              ออกจากระบบ

            </button>

          </div>

        </div>

      </div>

    </div>


    <!-- ======================================
         VACCINE MENU
    ======================================= -->

    <section class="ems-check-menu">


      <!-- VACCINE MASTER -->

      <button
        class="ems-check-menu-btn"
        data-page="vaccine-master"
      >

        <span class="ems-menu-icon">
          💉
        </span>

        <span class="ems-menu-text">
          Vaccine Master
        </span>

      </button>


      <!-- VACCINATION RECORD -->

      <button
        class="ems-check-menu-btn"
        data-page="vaccine-record"
      >

        <span class="ems-menu-icon">
          📋
        </span>

        <span class="ems-menu-text">
          Vaccination Record
        </span>

      </button>


      <!-- APPOINTMENT -->

      <button
        class="ems-check-menu-btn"
        data-page="vaccine-appointment"
      >

        <span class="ems-menu-icon">
          📅
        </span>

        <span class="ems-menu-text">
          Appointment
        </span>

      </button>


      <!-- REMINDER -->

      <button
        class="ems-check-menu-btn"
        data-page="vaccine-reminder"
      >

        <span class="ems-menu-icon">
          🔔
        </span>

        <span class="ems-menu-text">
          Reminder
        </span>

      </button>


      <!-- REPORT -->

      <button
        class="ems-check-menu-btn"
        data-page="vaccine-report"
      >

        <span class="ems-menu-icon">
          📊
        </span>

        <span class="ems-menu-text">
          Report
        </span>

      </button>


    </section>


  </div>

</div>
