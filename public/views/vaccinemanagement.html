<div class="ems-check-app">
  <div class="card stock-card">

    <!-- HEADER -->
    <div class="card-header stock-header">
      <div class="stock-header-left">
        <div class="stock-icon">💉</div>

        <div>
          <h1>IMMUNIZATION SERVICES</h1>
          <p>ระบบบริการและบริหารจัดการวัคซีน</p>
        </div>
      </div>

      <!-- USER MENU -->
      <div class="stock-header-right">
        <div class="ems-user-menu">
          <button
            type="button"
            class="ems-user-trigger"
            id="emsUserTrigger"
            aria-label="เมนูผู้ใช้งาน"
            aria-haspopup="true"
          >
            <span class="ems-user-avatar">
              <i class="fa-solid fa-user"></i>
            </span>

            <span class="ems-user-info">
              <strong id="currentUserName">สมชาย</strong>
              <small>ผู้ใช้งาน</small>
            </span>

            <i class="fa-solid fa-chevron-down ems-user-arrow"></i>
          </button>

          <div class="ems-user-dropdown" id="emsUserDropdown">
            <div class="ems-user-dropdown-header">
              <span class="ems-user-avatar large">
                <i class="fa-solid fa-user"></i>
              </span>

              <div>
                <strong id="dropdownUserName">สมชาย</strong>
                <small>ผู้ใช้งาน</small>
              </div>
            </div>

            <div class="ems-user-divider"></div>

            <button type="button" id="profileBtn">
              <i class="fa-solid fa-user"></i>
              โปรไฟล์
            </button>

            <button type="button" id="changePasswordBtn">
              <i class="fa-solid fa-key"></i>
              เปลี่ยนรหัสผ่าน
            </button>

            <div class="ems-user-divider"></div>

            <button
              type="button"
              class="ems-user-logout"
              id="logoutBtn"
            >
              <i class="fa-solid fa-right-from-bracket"></i>
              ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- VACCINE NAVIGATION -->
    <section class="ems-check-menu" aria-label="เมนูจัดการวัคซีน">

      <button
        type="button"
        class="ems-check-menu-btn"
        data-page="vaccine-master"
      >
        <span class="ems-menu-icon">💉</span>
        <span class="ems-menu-text">VACCINE INFORMATION</span>
      </button>

      <button
        type="button"
        class="ems-check-menu-btn"
        data-page="vaccine-record"
      >
        <span class="ems-menu-icon">📋</span>
        <span class="ems-menu-text">IMMUNIZATION SERVICES</span>
      </button>

      <button
        type="button"
        class="ems-check-menu-btn"
        data-page="vaccine-appointment"
      >
        <span class="ems-menu-icon">📅</span>
        <span class="ems-menu-text">APPOINTMENT SERVICES</span>
      </button>

      <button
        type="button"
        class="ems-check-menu-btn"
        data-page="vaccine-reminder"
      >
        <span class="ems-menu-icon">🔔</span>
        <span class="ems-menu-text">FOLLOW-UP SERVICES</span>
      </button>

      <button
        type="button"
        class="ems-check-menu-btn"
        data-page="vaccine-report"
      >
        <span class="ems-menu-icon">📊</span>
        <span class="ems-menu-text">ANALYTICS &amp; INTELLIGENCE</span>
      </button>

    </section>

    <!-- VACCINE STOCK SUMMARY -->
    <section
      class="vaccine-stock-summary-section"
      aria-label="สรุปข้อมูลวัคซีน"

      <div id="vaccineStockSummaryRoot">
        <div class="vaccine-stock-loading">
          กำลังโหลดข้อมูลวัคซีน...
        </div>
