<div class="ems-check-app">

    <div class="card stock-card">

<!-- ======================================
     HEADER — MODERN HEALTHCARE STYLE
======================================= -->
<div class="card-header stock-header">
  <div class="stock-header-left">
    <div class="stock-header-copy">
      <h3>Emergency Checklist</h3>
      <p>ระบบตรวจสอบอุปกรณ์ฉุกเฉิน เวชภัณฑ์ และวันหมดอายุ</p>
    </div>
  </div>
</div>

<!-- ================= MENU: 5 HORIZONTAL CARDS ================= -->
<section class="ems-check-menu" aria-label="Emergency Checklist Navigation">
  <button type="button" class="ems-check-menu-btn" data-route="inventory-master">
    <span class="ems-menu-icon" aria-hidden="true">📦</span>
    <span class="ems-menu-text">Inventory Master</span>
  </button>

  <button type="button" class="ems-check-menu-btn" data-route="branch-inventory-list" id="branchInventoryListMenu">
    <span class="ems-menu-icon" aria-hidden="true">🧩</span>
    <span class="ems-menu-text">Inventory List สาขา</span>
  </button>

  <button type="button" class="ems-check-menu-btn" data-route="receive-stock">
    <span class="ems-menu-icon" aria-hidden="true">📥</span>
    <span class="ems-menu-text">Inventory Stock</span>
  </button>

  <button type="button" class="ems-check-menu-btn" data-route="inventorydispense">
    <span class="ems-menu-icon" aria-hidden="true">📤</span>
    <span class="ems-menu-text">Inventory Dispense</span>
  </button>

  <button type="button" class="ems-check-menu-btn" data-route="dashboard">
    <span class="ems-menu-icon" aria-hidden="true">📋</span>
    <span class="ems-menu-text">Report</span>
  </button>
</section>

  <!-- ================= DAILY CHECK ================= -->

<section class="ems-check-daily">

  <div class="ems-daily-card">

    <div class="ems-daily-header">

      <div class="ems-daily-title">

        <div class="ems-daily-icon">
          📅

            ตารางตรวจสอบอุปกรณ์ Emergency ประจำวัน
          </span>

        </div>

      </div>

      <div class="ems-daily-filter">

        <label>เดือน</label>

        <select id="monthSelect"></select>

        <label>ปี</label>

        <select id="yearSelect"></select>

      </div>

    </div>

    <div class="ems-daily-table-wrapper">

      <table id="dailyTable">

        <thead>

          <tr>

      </table>

    </div>

  </div>

</section>

</div>
