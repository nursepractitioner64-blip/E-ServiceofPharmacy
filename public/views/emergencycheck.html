<div class="ems-check-app">

    <div class="card stock-card">

    <!-- ======================================
         HEADER
    ======================================= -->
    <div class="card-header stock-header">

      <div class="stock-header-left">

        <div class="stock-icon">
          🚑
        </div>

        <div>
          <h1>Emergency Checklist</h1>
          <p>ระบบตรวจสอบอุปกรณ์ฉุกเฉิน เวชภัณฑ์ และวันหมดอายุ</p>
        </div>

      </div>

<div class="stock-header-right">

  <!-- USER -->
  <div class="ems-user-menu">

    <button
      type="button"
      class="ems-user-trigger"
      id="emsUserTrigger"
    >

      <span class="ems-user-avatar">
        <i class="fa-solid fa-user"></i>
      </span>

      <span class="ems-user-info">
        <strong>สมชาย</strong>
        <small>ผู้ใช้งาน</small>
      </span>

      <i class="fa-solid fa-chevron-down ems-user-arrow"></i>

    </button>

    <div
      class="ems-user-dropdown"
      id="emsUserDropdown"
    >

      <div class="ems-user-dropdown-header">

        <span class="ems-user-avatar large">
          <i class="fa-solid fa-user"></i>
        </span>

        <div>
          <strong>สมชาย</strong>
          <small>ผู้ใช้งาน</small>
        </div>

      </div>

      <div class="ems-user-divider"></div>

      <button type="button">
        <i class="fa-solid fa-user"></i>
        โปรไฟล์
      </button>

      <button type="button">
        <i class="fa-solid fa-key"></i>
        เปลี่ยนรหัสผ่าน
      </button>

      <div class="ems-user-divider"></div>

      <button
        type="button"
        class="ems-user-logout"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        ออกจากระบบ
      </button>

    </div>

  </div>

</div>

    </div>
  <!-- ================= MENU ================= -->
<section class="ems-check-menu">

  <button class="ems-check-menu-btn" data-page="inventory">
    <span class="ems-menu-icon">📦</span>
    <span class="ems-menu-text">Inventory Master</span>
  </button>

  <button class="ems-check-menu-btn" data-page="receive">
    <span class="ems-menu-icon">📥</span>
    <span class="ems-menu-text">Inventory Stock</span>
  </button>

  <button class="ems-check-menu-btn" data-page="stockout">
    <span class="ems-menu-icon">📤</span>
    <span class="ems-menu-text">Inventory Dispense</span>
  </button>


  <button class="ems-check-menu-btn" data-page="report">
    <span class="ems-menu-icon">📋</span>
    <span class="ems-menu-text">Report</span>
  </button>

</section>

  <!-- ================= DAILY CHECK ================= -->

<section class="ems-check-daily">

  <div class="ems-daily-card">

    <div class="ems-daily-header">

      <div class="ems-daily-title">

        <div class="ems-daily-icon">
          📅
        </div>

        <div>

          <h2>Daily Emergency Check</h2>

          <span>
            ตารางตรวจสอบอุปกรณ์ Emergency ประจำวัน
          </span>

        </div>

      </div>

      <div class="ems-daily-filter">

        <label>เดือน</label>

        <select id="monthSelect"></select>

        <label>ปี</label>

        <select id="yearSelect"></select>

      </div>

    </div>

    <div class="ems-daily-table-wrapper">

        <tbody id="tbody"></tbody>

      </table>

    </div>

  </div>

</section>

</div>
