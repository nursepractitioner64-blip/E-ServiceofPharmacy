<section class="temperature-page container-fluid py-3">
  <header class="tc-hero">
    <div>
      <div class="tc-eyebrow">QUALITY & SAFETY CONTROL</div>
      <h1>Temperature Check</h1>
      <p>รายงานการควบคุมอุณหภูมิและความชื้นประจำเดือน</p>
    </div>
    <div class="tc-hero-icon">🌡️</div>
  </header>

  <section class="tc-panel tc-report-panel">
    <div class="tc-section-heading tc-report-heading">
      <div><h2>รายงานการควบคุมอุณหภูมิและความชื้น</h2><p>รูปแบบรายงานรายเดือน อ้างอิงแบบบันทึก PDF แนบ</p></div>
      <div class="tc-report-controls">
        <label for="tcBranchLabel">สาขาที่ได้รับอนุญาต</label><select id="tcBranchLabel" aria-label="เลือกสาขาที่ได้รับอนุญาต"><option value="">กำลังโหลดสาขา...</option></select>
        <label for="tcMonth">ประจำเดือน</label><input id="tcMonth" type="month">
        <button class="tc-btn tc-btn-primary" id="tcReload" type="button">↻ แสดงรายงาน</button>
        <button class="tc-btn tc-btn-print" id="tcPrint" type="button">⎙ พิมพ์ / PDF</button>
      </div>
    </div>
    <div class="tc-legend"><span><i class="tc-dot tc-ok"></i> อยู่ในเกณฑ์</span><span><i class="tc-dot tc-alert"></i> เกินเกณฑ์ — แจ้งผู้รับผิดชอบ</span><span>บันทึกวันละ 2 ครั้ง: 09:00 และ 16:00 น.</span></div>
    <div id="tcReport" class="tc-report">
      <div class="tc-empty">กำลังโหลดรายงาน...</div>
    </div>
    <div id="tcReportMessage" class="tc-message" role="status"></div>
  </section>

</section>
