<div class="tc-tab-content" data-tc-pane="form">
  <form id="temperatureForm" class="tc-form">
    <div class="tc-field"><label for="tcDate">วันที่บันทึก</label><input id="tcDate" name="date" type="date" required></div>
    <div class="tc-field"><label for="tcTime">รอบเวลา</label><select id="tcTime" name="time" required><option value="09:00">09:00 น.</option><option value="16:00">16:00 น.</option></select></div>
    <div class="tc-field"><label for="tcType">ประเภทการตรวจ</label><select id="tcType" name="type" required>
      <option value="freezer">ตู้เย็น — ช่องแช่แข็ง (°C)</option>
      <option value="fridge">ตู้เย็น — ช่องธรรมดา (°C)</option>
      <option value="room">อุณหภูมิห้อง (°C)</option>
      <option value="humidity">ความชื้นสัมพัทธ์ (%)</option>
    </select></div>
    <div class="tc-field"><label for="tcValue">ค่าที่วัดได้</label><div class="tc-input-unit"><input id="tcValue" name="value" type="number" step="0.1" required placeholder="ระบุตัวเลข"><span id="tcUnit">°C</span></div></div>
    <div class="tc-field tc-wide"><label for="tcRemark">หมายเหตุ / การดำเนินการเมื่อค่าเกินเกณฑ์</label><input id="tcRemark" name="remark" type="text" maxlength="500" placeholder="เช่น แจ้งผู้รับผิดชอบและตรวจสอบซ้ำ"></div>
    <div class="tc-form-actions"><button class="tc-btn tc-btn-primary" type="submit" id="tcSaveBtn">บันทึกข้อมูล</button><button class="tc-btn tc-btn-quiet" type="reset">ล้างแบบฟอร์ม</button></div>
  </form>
  <div id="tcFormMessage" class="tc-message" role="status"></div>
</div>
