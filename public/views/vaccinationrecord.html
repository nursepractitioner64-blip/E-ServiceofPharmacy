<!-- =====================================================
     INVENTORY MODAL
===================================================== -->

<div
  class="inv-modal"
  id="inventoryModal"
  aria-hidden="true"
>

  <!-- OVERLAY -->

  <div
    class="inv-modal-overlay"
    id="closeInventoryModal"
  ></div>


  <!-- MODAL BOX -->

  <div
    class="inv-modal-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="inventoryModalTitle"
  >


    <!-- HEADER -->

    <div class="inv-modal-header">

      <div>

        <h2 id="inventoryModalTitle">
          เพิ่มรายการ Inventory
        </h2>

        <p>
          บันทึกข้อมูลลง Sheet : INVENTORY_MASTER
        </p>

      </div>


      <button
        type="button"
        class="inv-modal-close"
        id="closeInventoryModalBtn"
        aria-label="ปิด"
      >
        ✖️
      </button>

    </div>


    <!-- FORM -->

    <form id="inventoryForm">

      <div class="inv-form-grid">


        <!-- CODE -->

        <div class="inv-form-group">

          <label for="inventoryCode">
            CODE
          </label>

          <input
            type="text"
            id="inventoryCode"
            name="code"
            placeholder="DRG0001"
            autocomplete="off"
            required
          >

        </div>


        <!-- UNIT -->

        <div class="inv-form-group">

          <label for="inventoryUnit">
            UNIT
          </label>

          <input
            type="text"
            id="inventoryUnit"
            name="unit"
            placeholder="amp / box / pcs"
            autocomplete="off"
            required
          >

        </div>

      </div>


      <!-- NAME -->

      <div class="inv-form-group">

        <label for="inventoryName">
          NAME
        </label>

        <input
          type="text"
          id="inventoryName"
          name="name"
          placeholder="ชื่อยา / เวชภัณฑ์ / อุปกรณ์"
          autocomplete="off"
          required
        >

      </div>


      <!-- REQUIRED -->

      <div class="inv-form-group">

        <label for="inventoryRequired">
          REQUIRED
        </label>

        <input
          type="number"
          id="inventoryRequired"
          name="required"
          min="0"
          step="1"
          placeholder="0"
          required
        >

      </div>


      <!-- FOOTER -->

      <div class="inv-modal-footer">

        <button
          type="button"
          class="inv-btn inv-btn-light"
          id="cancelInventoryModal"
        >
          🚫 ยกเลิก
        </button>


        <button
          type="submit"
          class="inv-btn inv-btn-success"
          id="saveInventoryBtn"
        >
          💾
          บันทึก
        </button>

      </div>

    </form>

  </div>

</div>

<!-- =====================================================
     BACK TO EMERGENCY CHECKLIST
===================================================== -->

<script>

  document
    .getElementById("backEmergencyHomeBtn")
    ?.addEventListener(
      "click",
      () => {

        /*
         * ใช้ SPA route ของระบบ
         * ไม่ reload emergencycheck.html
         */

        if (
          typeof window.navigate === "function"
        ) {

          window.navigate(
            "emergency-checklist"
          );

          return;

        }


        /*
         * fallback กรณี app.js
         * ไม่ได้ expose navigate()
         */

        window.location.hash =
          "#emergency-checklist";

      }
    );

</script>
