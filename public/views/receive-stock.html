<!-- =========================================================
     RECEIVE STOCK MODULE (RSM)
     FULLY SCOPED UI
     ไม่มี psc-* / dsc-* / class จาก Module อื่น
========================================================= -->

<main class="rsm-page" id="rsmPage">

  <div class="rsm-container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="rsm-header-card">

      <div class="rsm-header-left">

        <span class="rsm-badge">
          📦 Inventory Stock
        </span>

        <h1>
          Inventory Stock
        </h1>

        <p>
          จัดการข้อมูลเวชภัณฑ์ ยา และอุปกรณ์ภายในคลัง
        </p>

      </div>


      <!-- ===================================================
           ACTION BAR
      ==================================================== -->

      <div class="rsm-action-bar">

        <!-- หน้าแรก -->
        <button
          type="button"
          class="rsm-btn rsm-btn-primary"
          id="backHomeBtn"
        >
          🏠
          <span>หน้าแรก</span>
        </button>


        <!-- รับสินค้าเข้า -->
        <button
          type="button"
          class="rsm-btn rsm-btn-primary"
          id="openReceiveStockModal"
        >
          📥
          <span>รับสินค้าเข้า</span>
        </button>


        <!-- พิมพ์สติกเกอร์ -->
        <button
          type="button"
          class="rsm-btn rsm-btn-success"
          id="openStickerPrint"
        >
          🖨️
          <span>พิมพ์สติกเกอร์</span>
        </button>

      </div>

    </section>


    <!-- =====================================================
         TABLE CARD
    ====================================================== -->

    <section class="rsm-card">

      <div class="rsm-table-toolbar">

        <div class="rsm-toolbar-title">

          <h3>
            รายการรับสินค้าเข้าคลัง
          </h3>

          <span>
            รายการเวชภัณฑ์และยาที่รับเข้าระบบ
          </span>

        </div>

      </div>


      <!-- ===================================================
           TABLE
      ==================================================== -->

      <div class="rsm-table-wrapper">

        <table class="rsm-table">

          <thead>

            <tr>
              <th>DATE</th>
              <th>CODE</th>
              <th>NAME</th>
              <th>QTY</th>
              <th>UNIT</th>
              <th>LOT</th>
              <th>EXP</th>
              <th>QRCODE</th>
            </tr>

          </thead>

          <tbody id="receiveStockTable"></tbody>

        </table>

      </div>

    </section>

  </div>

</main>


<!-- =========================================================
     RECEIVE STOCK MODAL
========================================================= -->

<div
  class="rsm-modal"
  id="ReceiveStockModal"
  aria-hidden="true"
>

  <div
    class="rsm-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="rsmReceiveModalTitle"
  >

    <!-- =====================================================
         MODAL HEADER
    ====================================================== -->

    <div class="rsm-modal-header">

      <div>

        <h2 id="rsmReceiveModalTitle">
          รับสินค้าเข้าคลัง
        </h2>

        <p>
          เพิ่มรายการรับยาและเวชภัณฑ์
        </p>

      </div>


      <button
        type="button"
        class="rsm-btn rsm-btn-light js-close-receive-modal"
        aria-label="ปิดหน้าต่าง"
      >
        ✖️
      </button>

    </div>


    <!-- =====================================================
         FORM
    ====================================================== -->

    <form
      id="receivestockForm"
      class="rsm-form"
      novalidate
    >

      <input
        type="hidden"
        name="type"
        value="IN"
      />


      <div class="rsm-form-grid">

        <!-- =================================================
             RECEIVE NO
        ================================================== -->

        <div class="rsm-field">

          <label for="receivestockNo">
            เลขที่รับเข้า
          </label>

          <input
            type="text"
            name="receivestockNo"
            id="receivestockNo"
            readonly
          />

        </div>


        <!-- =================================================
             DATE
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmDateIn">
            วันที่รับเข้า
          </label>

          <input
            type="date"
            name="dateIn"
            id="rsmDateIn"
            required
          />

        </div>


        <!-- =================================================
             SUPPLIER
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmSupplier">
            Supplier
          </label>

          <input
            type="text"
            name="supplier"
            id="rsmSupplier"
            autocomplete="off"
            required
          />

        </div>


        <!-- =================================================
             USER
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmUser">
            User
          </label>

          <input
            type="text"
            name="user"
            id="rsmUser"
            autocomplete="off"
            required
          />

        </div>


        <!-- =================================================
             DRUG
        ================================================== -->

        <div class="rsm-field rsm-field-lg">

          <label for="drugSelectReceive">
            รหัสยา
          </label>

          <select
            id="drugSelectReceive"
            required
          >

            <option value="">
              เลือกยา
            </option>

          </select>


          <input
            type="hidden"
            name="code"
            id="code"
          />

        </div>


        <!-- =================================================
             NAME
        ================================================== -->

        <div class="rsm-field rsm-field-lg">

          <label for="name">
            ชื่อยา
          </label>

          <input
            type="text"
            name="name"
            id="name"
            readonly
          />

        </div>


        <!-- =================================================
             QTY
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmQty">
            จำนวน
          </label>

          <input
            type="number"
            name="qty"
            id="rsmQty"
            min="1"
            step="1"
            required
          />

        </div>


        <!-- =================================================
             UNIT
        ================================================== -->

        <div class="rsm-field">

          <label for="unit">
            หน่วย
          </label>

          <input
            type="text"
            name="unit"
            id="unit"
            readonly
          />

        </div>


        <!-- =================================================
             LOT
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmLot">
            LOT
          </label>

          <input
            type="text"
            name="lot"
            id="rsmLot"
            autocomplete="off"
            required
          />

        </div>


        <!-- =================================================
             EXP
        ================================================== -->

        <div class="rsm-field">

          <label for="rsmExp">
            วันหมดอายุ
          </label>

          <input
            type="date"
            name="exp"
            id="rsmExp"
            required
          />

        </div>

      </div>


      <!-- ===================================================
           MODAL FOOTER
      ==================================================== -->

      <div class="rsm-modal-footer">

        <button
          type="button"
          class="rsm-btn rsm-btn-light js-close-receive-modal"
        >
          🚫
          <span>ยกเลิก</span>
        </button>


        <button
          type="submit"
          class="rsm-btn rsm-btn-success"
        >
          💾
          <span>บันทึกข้อมูล</span>
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================================================
     DISPENSE MODAL
     RSM SCOPED
     
     หมายเหตุ:
     เก็บ ID เดิมไว้เพื่อไม่ให้ JS เดิมพัง
========================================================= -->

<div
  class="rsm-modal"
  id="DispenseModal"
  aria-hidden="true"
>

  <div
    class="rsm-modal-card rsm-dispense-modal-card"
    role="dialog"
    aria-modal="true"
  >

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="rsm-modal-header">

      <div>

        <h2>
          จ่ายยา
        </h2>

        <p>
          บันทึกรายการจ่ายยาออกจากคลัง
        </p>

      </div>


      <button
        type="button"
        class="rsm-btn rsm-btn-light"
        id="closeDispenseModal"
      >
        ✖️
      </button>

    </div>


    <!-- =====================================================
         FORM AREA
    ====================================================== -->

    <div class="rsm-form-grid">

      <!-- DRUG -->

      <div class="rsm-field rsm-field-lg">

        <label for="drugSelectDispense">
          รหัสยา
        </label>

        <select
          id="drugSelectDispense"
          required
        >

          <option value="">
            เลือกยา
          </option>

        </select>


        <input
          type="hidden"
          name="code"
          id="dispenseCode"
        />

      </div>


      <!-- NAME -->

      <div class="rsm-field rsm-field-lg">

        <label for="dispenseName">
          ชื่อยา
        </label>

        <input
          type="text"
          name="name"
          id="dispenseName"
          readonly
        />

      </div>


      <!-- QTY -->

      <div class="rsm-field">

        <label for="dispenseQty">
          จำนวน
        </label>

        <input
          type="number"
          name="qty"
          id="dispenseQty"
          min="1"
          step="1"
          required
        />

      </div>


      <!-- UNIT -->

      <div class="rsm-field">

        <label for="dispenseUnit">
          หน่วย
        </label>

        <input
          type="text"
          name="unit"
          id="dispenseUnit"
          readonly
        />

      </div>


      <!-- LOT -->

      <div class="rsm-field">

        <label for="dispenseLot">
          LOT
        </label>

        <input
          type="text"
          name="lot"
          id="dispenseLot"
          required
        />

      </div>


      <!-- EXP -->

      <div class="rsm-field">

        <label for="dispenseExp">
          วันหมดอายุ
        </label>

        <input
          type="date"
          name="exp"
          id="dispenseExp"
          required
        />

      </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="rsm-modal-footer">

      <button
        type="button"
        class="rsm-btn rsm-btn-light"
        id="rsmCancelDispense"
      >
        🚫
        <span>ยกเลิก</span>
      </button>

      <button
        type="button"
        class="rsm-btn rsm-btn-success"
        id="rsmSaveDispense"
      >
        💾
        <span>บันทึกข้อมูล</span>
      </button>

    </div>

  </div>

</div>
