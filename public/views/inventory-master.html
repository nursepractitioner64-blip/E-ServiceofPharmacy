<!-- =====================================================
     INVENTORY MASTER PAGE
===================================================== -->

<section class="inv-page" id="invPage">
  <main class="psc-app">
    <section class="psc-page">
      <div class="psc-card psc-stock-card">

        <!-- ======================================
             HEADER
        ======================================= -->

        <div class="psc-stock-header">
          <div class="psc-stock-title">
            <h1>Inventory Master List</h1>
            <p>จัดการข้อมูลเวชภัณฑ์ ยา และอุปกรณ์ทั้งหมด</p>
          </div>

          <div class="dsc-dispense-action-bar">

            <!-- BACK HOME -->
            <button type="button" class="btn btn-back-home" id="backEmergencyHomeBtn">
              🏠หน้าแรก
            </button>

            <button type="button" class="btn btn-refresh" id="openAddInventoryModal">
              📝เพิ่มรายการ
            </button>

          </div>

        </div>

        <!-- ======================================
             TABLE
        ======================================= -->

        <div class="psc-table-container">
          <table class="psc-table">
            <thead>
              <tr>
                <th>CODE</th>
                <th>NAME</th>
                <th>UNIT</th>
                <th>REQUIRED</th>
                <th>จัดการ</th>
              </tr>
            </thead>

            <tbody id="inventoryMasterTable">

              <tr>

                <td colspan="5" class="text-center py-4">
                  กำลังโหลดข้อมูล...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>

</section>


<!-- =====================================================
     INVENTORY MODAL
===================================================== -->

<div
  class="inv-modal"
  id="inventoryModal"
  aria-hidden="true"
>

  <!-- OVERLAY -->

  <div
    class="inv-modal-overlay"
    id="closeInventoryModal"
  ></div>


  <!-- MODAL BOX -->

  <div
    class="inv-modal-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="inventoryModalTitle"
  >


    <!-- HEADER -->

    <div class="inv-modal-header">

      <div>

        <h2 id="inventoryModalTitle">
          เพิ่มรายการ Inventory
        </h2>

        <p>
          บันทึกข้อมูลลง Sheet : INVENTORY_MASTER
        </p>

      </div>


      <button
        type="button"
        class="inv-modal-close"
        id="closeInventoryModalBtn"
        aria-label="ปิด"
      >
        ✖️
      </button>

    </div>


    <!-- FORM -->

    <form id="inventoryForm">

      <div class="inv-form-grid">


        <!-- CODE -->

        <div class="inv-form-group">

          <label for="inventoryCode">
            CODE
          </label>

          <input
            type="text"
            id="inventoryCode"
            name="code"
            placeholder="DRG0001"
            autocomplete="off"
            required
          >

        </div>


        <!-- UNIT -->

        <div class="inv-form-group">

          <label for="inventoryUnit">
            UNIT
          </label>

          <input
            type="text"
            id="inventoryUnit"
            name="unit"
            placeholder="amp / box / pcs"
            autocomplete="off"
            required
          >

        </div>

      </div>


      <!-- NAME -->

      <div class="inv-form-group">

        <label for="inventoryName">
          NAME
        </label>

        <input
          type="text"
          id="inventoryName"
          name="name"
          placeholder="ชื่อยา / เวชภัณฑ์ / อุปกรณ์"
          autocomplete="off"
          required
        >

      </div>


      <!-- REQUIRED -->

      <div class="inv-form-group">

        <label for="inventoryRequired">
          REQUIRED
        </label>

        <input
          type="number"
          id="inventoryRequired"
          name="required"
          min="0"
          step="1"
          placeholder="0"
          required
        >

      </div>


      <!-- FOOTER -->

      <div class="inv-modal-footer">

        <button
          type="button"
          class="inv-btn inv-btn-light"
          id="cancelInventoryModal"
        >
          🚫 ยกเลิก
        </button>


        <button
          type="submit"
          class="inv-btn inv-btn-success"
          id="saveInventoryBtn"
        >
          💾
          บันทึก
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =====================================================
     BACK HOME STYLE
===================================================== -->

<style>

  .btn-back-home {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    height: 34px;

    padding: 0 13px;

    margin-bottom: 8px;

    border: 1px solid #d9dee6;

    border-radius: 7px;

    background: #ffffff;

    color: #495057;

    font-family:
      "Prompt",
      "Prompt",
      sans-serif;

    font-size: 13px;

    font-weight: 500;

    line-height: 1;

    cursor: pointer;

    transition:
      all .15s ease;

  }


  .btn-back-home i {

    font-size: 12px;

  }


  .btn-back-home:hover {

    background: #f5f8fb;

    border-color: #adb5bd;

    color: #212529;

    transform:
      translateY(-1px);

  }


  .btn-back-home:active {

    transform:
      translateY(0);

  }

</style>


<!-- =====================================================
     BACK TO EMERGENCY CHECKLIST
===================================================== -->

<script>

  document
    .getElementById("backEmergencyHomeBtn")
    ?.addEventListener(
      "click",
      () => {

        /*
         * ใช้ SPA route ของระบบ
         * ไม่ reload emergencycheck.html
         */

        if (
          typeof window.navigate === "function"
        ) {

          window.navigate(
            "emergency-checklist"
          );

          return;

        }


        /*
         * fallback กรณี app.js
         * ไม่ได้ expose navigate()
         */

        window.location.hash =
          "#emergency-checklist";

      }
    );

</script>
