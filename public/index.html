<style>

/* =====================================================
   GLOBAL FONT
   TEXT ทั้งระบบ = PROMPT
===================================================== */

:root {
  --app-font-family: "Prompt", sans-serif;
}

html,
body {
  font-family: "Prompt", sans-serif !important;
}

body,
body * {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   FORM ELEMENTS
===================================================== */

button,
input,
textarea,
select,
option {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   TABLE
===================================================== */

table,
thead,
tbody,
tfoot,
tr,
th,
td {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   LINKS
===================================================== */

a,
a * {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   MODAL
===================================================== */

.modal,
.modal *,
#modal-root,
#modal-root * {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   TOM SELECT
===================================================== */

.ts-control,
.ts-control *,
.ts-dropdown,
.ts-dropdown * {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   SWEET ALERT
===================================================== */

.swal2-container,
.swal2-container *,
.swal2-popup,
.swal2-popup * {
  font-family: "Prompt", sans-serif !important;
}


/* =====================================================
   FONT AWESOME
   ICON = FONT AWESOME
===================================================== */

.fa,
.fas,
.far,
.fal,
.fab,
.fad,
.fa-solid,
.fa-regular,
.fa-light,
.fa-thin,
.fa-duotone,
.fa-brands {

  font-style: normal;
  line-height: 1;

}


/* =====================================================
   FONT AWESOME SOLID
===================================================== */

.fa-solid,
.fas {

  font-family:
    "Font Awesome 6 Free" !important;

  font-weight: 900 !important;

}


/* =====================================================
   FONT AWESOME REGULAR
===================================================== */

.fa-regular,
.far {

  font-family:
    "Font Awesome 6 Free" !important;

  font-weight: 400 !important;

}


/* =====================================================
   FONT AWESOME BRANDS
===================================================== */

.fa-brands,
.fab {

  font-family:
    "Font Awesome 6 Brands" !important;

  font-weight: 400 !important;

}


/* =====================================================
   FONT AWESOME ICON ELEMENT
===================================================== */

i[class^="fa-"],
i[class*=" fa-"] {

  display: inline-block;

  line-height: 1;

  text-rendering: auto;

  -webkit-font-smoothing: antialiased;

}


/* =====================================================
   FONT AWESOME INSIDE BUTTON
===================================================== */

button .fa,
button .fas,
button .far,
button .fab,
button .fa-solid,
button .fa-regular,
button .fa-brands {

  font-family:
    "Font Awesome 6 Free" !important;

}


/* =====================================================
   FONT AWESOME BRANDS INSIDE BUTTON
===================================================== */

button .fa-brands,
button .fab,
a .fa-brands,
a .fab {

  font-family:
    "Font Awesome 6 Brands" !important;

}


/* =====================================================
   ICON + TEXT

   ตัวอย่าง:

   <i class="fa-solid fa-plus"></i>
   เพิ่มข้อมูล

   ICON = Font Awesome
   TEXT = Prompt
===================================================== */

i[class^="fa-"],
i[class*=" fa-"] {

  font-family:
    "Font Awesome 6 Free" !important;

}

i.fa-brands,
i.fab {

  font-family:
    "Font Awesome 6 Brands" !important;

}

</style>
