  <!-- =====================================================
       GLOBAL FONT CONTROL
       
       TEXT       = PROMPT
       ICON       = FONT AWESOME
  ====================================================== -->

  <style>

    /* =====================================================
       PROMPT
       ใช้กับข้อความทั้งหมดของระบบ
    ===================================================== */

    html,
    body {

      font-family:
        "Prompt",
        sans-serif;

    }


    body *,
    body *::before,
    body *::after {

      font-family:
        "Prompt",
        sans-serif;

    }


    /* =====================================================
       FONT AWESOME
       สำคัญมาก
       
       ไม่ให้ CSS ด้านบนไปทับ Font Awesome
    ===================================================== */

    .fa,
    .fas,
    .far,
    .fal,
    .fab,
    .fad,
    .fa-solid,
    .fa-regular,
    .fa-light,
    .fa-thin,
    .fa-duotone,
    .fa-brands {

      font-family:
        "Font Awesome 6 Free" !important;

      font-style: normal;

      line-height: 1;

    }


    /* =====================================================
       SOLID
    ===================================================== */

    .fa-solid,
    .fas {

      font-family:
        "Font Awesome 6 Free" !important;

      font-weight: 900 !important;

    }


    /* =====================================================
       REGULAR
    ===================================================== */

    .fa-regular,
    .far {

      font-family:
        "Font Awesome 6 Free" !important;

      font-weight: 400 !important;

    }


    /* =====================================================
       BRANDS
    ===================================================== */

    .fa-brands,
    .fab {

      font-family:
        "Font Awesome 6 Brands" !important;

      font-weight: 400 !important;

    }


    /* =====================================================
       FONT AWESOME ALIGNMENT
    ===================================================== */

    i[class^="fa-"],
    i[class*=" fa-"] {

      display: inline-block;

      line-height: 1;

      text-rendering: auto;

      -webkit-font-smoothing: antialiased;

    }


    /* =====================================================
       TOM SELECT
       ข้อความยังใช้ PROMPT
    ===================================================== */

    .ts-control,
    .ts-control *,
    .ts-dropdown,
    .ts-dropdown * {

      font-family:
        "Prompt",
        sans-serif !important;

    }


    /* =====================================================
       BUTTON
    ===================================================== */

    button {

      font-family:
        "Prompt",
        sans-serif;

    }


    /* =====================================================
       INPUT
    ===================================================== */

    input,
    textarea,
    select,
    option {

      font-family:
        "Prompt",
        sans-serif;

    }


    /* =====================================================
       TABLE
    ===================================================== */

    table,
    th,
    td {

      font-family:
        "Prompt",
        sans-serif;

    }


    /* =====================================================
       FONT AWESOME INSIDE BUTTON
    ===================================================== */

    button i.fa-solid,
    button i.fa-regular,
    button i.fa-brands,
    a i.fa-solid,
    a i.fa-regular,
    a i.fa-brands {

      font-family:
        "Font Awesome 6 Free" !important;

    }


    /* =====================================================
       BRANDS INSIDE BUTTON / LINK
    ===================================================== */

    button i.fa-brands,
    a i.fa-brands {

      font-family:
        "Font Awesome 6 Brands" !important;

    }

  </style>

</head>
